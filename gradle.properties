# Wingman-specific settings. The reusable build.gradle.kts has no Wingman names or overlay rules.
# Do not copy these settings to a fully sourced mod.
modFolderName=Wingman
seedJar=jars/Wingman.jar
mainSourceExcludes=**/patch/**
patchSourceIncludes=**/*Patch.java,wingman/patch/Patches.java
# The seed JAR still holds the old copies of classes that moved to wingman.host / wingman.client: leave them out.
seedExcludes=wingman/MessageSpy*.class,wingman/OfficerCombatSkills*.class,wingman/OfficerPotential*.class,wingman/OfficerPotentialLevelupPlugin.class,wingman/patch/SkillScreenScrollPatch.class,wingman/BattleStats.class,wingman/BattleStats$*.class,wingman/CampaignLobby.class,wingman/CampaignLobby$*.class,wingman/CampaignNews.class,wingman/CampaignNews$*.class,wingman/CampaignPlayerList.class,wingman/CampaignPlayerList$*.class,wingman/CarrierHoldAI.class,wingman/CarrierHoldAI$*.class,wingman/FriendRefit.class,wingman/FriendRefit$*.class,wingman/FriendRefitPanel.class,wingman/FriendRefitPanel$*.class,wingman/GroupFire.class,wingman/GroupFire$*.class,wingman/HostCampaign.class,wingman/HostCampaign$*.class,wingman/HostCampaignMap.class,wingman/HostCampaignMap$*.class,wingman/HostDamage.class,wingman/HostDamage$*.class,wingman/HostEnvironment.class,wingman/HostEnvironment$*.class,wingman/HostExtras.class,wingman/HostExtras$*.class,wingman/HostOrders.class,wingman/HostOrders$*.class,wingman/Hosting.class,wingman/Hosting$*.class,wingman/Identity.class,wingman/Identity$*.class,wingman/RemotePilotAI.class,wingman/RemotePilotAI$*.class,wingman/AfterAction.class,wingman/AfterAction$*.class,wingman/BayLink.class,wingman/BayLink$*.class,wingman/BayQuiet.class,wingman/BayQuiet$*.class,wingman/CampaignStandIn.class,wingman/CampaignStandIn$*.class,wingman/ClientEnvironment.class,wingman/ClientEnvironment$*.class,wingman/ClientOrders.class,wingman/ClientOrders$*.class,wingman/Compat.class,wingman/Compat$*.class,wingman/CoopScreen.class,wingman/CoopScreen$*.class,wingman/Drafts.class,wingman/Drafts$*.class,wingman/FighterUnlock.class,wingman/FighterUnlock$*.class,wingman/GuardedMissileAI.class,wingman/GuardedMissileAI$*.class,wingman/HullGuard.class,wingman/HullGuard$*.class,wingman/JoinForm.class,wingman/JoinForm$*.class,wingman/JoinSetup.class,wingman/JoinSetup$*.class,wingman/JoinerAgentLink.class,wingman/JoinerAgentLink$*.class,wingman/LocalDamage.class,wingman/LocalDamage$*.class,wingman/LobbyScreen.class,wingman/LobbyScreen$*.class,wingman/MirrorObjectiveEffect.class,wingman/MirrorObjectiveEffect$*.class,wingman/MissedLookups.class,wingman/MissedLookups$*.class,wingman/NoDamage.class,wingman/NoDamage$*.class,wingman/ObjectiveMirror.class,wingman/ObjectiveMirror$*.class,wingman/OfficerSkillMenu.class,wingman/OfficerSkillMenu$*.class,wingman/PuppetMissileAI.class,wingman/PuppetMissileAI$*.class,wingman/RefitScreen.class,wingman/RefitScreen$*.class,wingman/RefitSlot.class,wingman/RefitSlot$*.class,wingman/RefitWeaponArc.class,wingman/RefitWeaponArc$*.class,wingman/ShipPicture.class,wingman/ShipPicture$*.class,wingman/ShipSystemInfo.class,wingman/ShipSystemInfo$*.class,wingman/SystemWatch.class,wingman/SystemWatch$*.class,wingman/Tips.class,wingman/Tips$*.class,wingman/TitleMenu.class,wingman/TitleMenu$*.class,wingman/WingmanClientPlugin.class,wingman/WingmanClientPlugin$*.class
corePath=/mnt/d/Starsector/starsector-core

# Reuse the Gradle JVM between builds.
org.gradle.daemon=true

# Allow independent projects to execute in parallel.
org.gradle.parallel=true

# Reuse task outputs between builds.
org.gradle.caching=true

# Reuse the configured task graph between builds.
org.gradle.configuration-cache=true

# Keep the build JVM's encoding deterministic; Starsector mod assets and sources are UTF-8.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
