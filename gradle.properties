# Wingman-specific settings. The reusable build.gradle.kts has no Wingman names or overlay rules.
# Do not copy these settings to a fully sourced mod.
modFolderName=Wingman
seedJar=jars/Wingman.jar
mainSourceExcludes=**/patch/**,wingman/MessageSpy.java,wingman/TitleLauncher.java
patchSourceIncludes=**/*Patch.java,wingman/patch/Patches.java
seedExcludes=wingman/OfficerCombatSkills*.class,wingman/OfficerPotential*.class,wingman/OfficerPotentialLevelupPlugin.class,wingman/patch/SkillScreenScrollPatch.class
corePath=/mnt/d/Starsector/starsector-core

# Reuse the Gradle JVM between builds.
org.gradle.daemon=true

# Allow independent projects to execute in parallel.
org.gradle.parallel=true

# Reuse task outputs between builds.
org.gradle.caching=true

# Reuse the configured task graph between builds.
org.gradle.configuration-cache=true

# Keep the build JVM's encoding deterministic; Starsector mod assets and sources are UTF-8.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
